[env]
TERM = "xterm-256color"

# [terminal.shell]
# program = "zellij"

[window]
padding.x = 16
padding.y = 14
decorations = "None"
opacity = 0.98

[keyboard]
bindings = [
{ key = "F11", action = "ToggleFullscreen" },
{ key = "W", mods = "Control", command = { program = "/bin/sh", args = ["-c", "osascript -e 'display dialog \"Quit Alacritty?\" buttons {\"Cancel\", \"Quit\"} default button \"Cancel\" with icon caution' && pkill -x alacritty"] } },
{ key = "Q", mods = "Control", command = { program = "/bin/sh", args = ["-c", "osascript -e 'display dialog \"Quit Alacritty?\" buttons {\"Cancel\", \"Quit\"} default button \"Cancel\" with icon caution' && pkill -x alacritty"] } },
{ key = "N", mods = "Control", action = "SpawnNewInstance" }
]
